name: 🚀 Deploy to EC2

on:
  push:
    branches:
      - feature/initial-setup

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa || echo "Failed to add SSH key"
          
      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          
      - name: Debug SSH key
        run: |
          ls -la ~/.ssh/
          # Don't print the key content but check if it exists and its size
          if [ -s ~/.ssh/id_rsa ]; then
            echo "SSH key exists and is not empty"
          else
            echo "SSH key is missing or empty"
            exit 1
          fi
          
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Export secret as an environment variable
            export MY_SECRET_KEY="${{ secrets.MY_SECRET_KEY }}"
            
            # Navigate to the project folder and pull the latest changes
            cd ~/min_app_services/Bookify_Hub_Services
            git pull origin feature/initial-setup
            
            # Run the deployment script
            bash ~/deploy.sh
          EOF
