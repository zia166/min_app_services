name: 🚀 Deploy to EC2

on:
  push:
    branches:
      - feature/initial-setup

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Check Secret Availability
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::error::EC2_HOST secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "::error::EC2_USER secret is not set or empty"
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY secret is not set or empty"
            exit 1
          fi
          echo "All required secrets are available"
      
      - name: Set up SSH (Using ssh-key-action)
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.EC2_HOST }}
          if_key_exists: replace
      
      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      
      - name: Verify SSH Setup
        run: |
          ls -la ~/.ssh/
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -T ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} echo "SSH connection successful" || echo "SSH connection failed"
      
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Export secret as an environment variable
            export MY_SECRET_KEY="${{ secrets.MY_SECRET_KEY }}"
            
            # Navigate to the project folder and pull the latest changes
            cd ~/min_app_services/Bookify_Hub_Services
            git pull origin feature/initial-setup
            
            # Run the deployment script
            bash ~/deploy.sh
          EOF
